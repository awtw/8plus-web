<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--color-dark); padding: 22px; color: #fff; }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; }
  .t { color: rgba(255,255,255,.4); font-family: var(--font-mono); font-size: 10px; width: 32px; }
  .d { font-family: var(--font-display); letter-spacing: -0.03em; }
  .b { font-family: var(--font-body); }
  .m { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,.76); }
</style>
</head>
<body>
  <div class="r"><span class="t">H1</span><span class="d" style="font-size:40px;font-weight:600">架構先行</span></div>
  <div class="r"><span class="t">H2</span><span class="d" style="font-size:28px;font-weight:400">核心服務</span></div>
  <div class="r"><span class="t">H3</span><span class="b" style="font-size:22px;font-weight:500">Pricing tier</span></div>
  <div class="r"><span class="t">H4</span><span class="b" style="font-size:18px;font-weight:500">Pillar 標題</span></div>
  <div class="r"><span class="t">H6</span><span class="m" style="font-size:13px">01 · STORY</span></div>
</body>
</html>
