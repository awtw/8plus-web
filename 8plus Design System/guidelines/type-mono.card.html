<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--color-dark); padding: 22px; }
  pre { margin: 0; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; background: rgba(255,255,255,.06); color: #fff; padding: 16px 18px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,.12); }
  .k { color: #7dd3fc; } .s { color: #86efac; } .c { color: rgba(255,255,255,.5); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,.6); margin-top: 10px; }
</style>
</head>
<body>
  <pre><span class="c">// FIG.01 — TRUST HANDSHAKE</span>
<span class="k">const</span> mission = <span class="s">"deliver needs as trusted systems"</span>;</pre>
  <div class="meta">JetBrains Mono 400/500 · eyebrows, section numbers (01–05), FIG marks, inline code</div>
</body>
</html>
