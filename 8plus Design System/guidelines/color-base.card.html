<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #0A0E1A; padding: 20px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 200px; height: 84px; border-radius: var(--radius-md); border: 1px solid var(--border-soft); display: flex; align-items: flex-end; padding: 12px; }
  .name { font-size: 13px; font-weight: 600; color: #fff; }
  .val { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#002FA7"><span class="name">Klein Blue</span></div><div class="val">--color-blue · #002FA7</div></div>
    <div class="sw"><div class="chip" style="background:#FE5000"><span class="name">Pantone Orange</span></div><div class="val">--color-orange · #FE5000</div></div>
    <div class="sw"><div class="chip" style="background:#0A0E1A"><span class="name">Deep night</span></div><div class="val">--color-dark · #0A0E1A</div></div>
  </div>
</body>
</html>
