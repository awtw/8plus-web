// ?lang=en and ?format=tall pick the copy and the 4:5 cut. The renderer never sets these.
const Q = new URLSearchParams(location.search);
const LIVE = Q.get('live') === '1';
const DEFAULTS = Object.fromEntries(JSON.parse(document.documentElement.dataset.compositionVariables).map((d) => [d.id, d.default]));
const V = { ...DEFAULTS, ...OM.vars(), ...(LIVE && Q.get('lang') ? { lang: Q.get('lang') } : {}) };
const L = V.lang === 'en' ? 'en' : 'zh';
const film = document.getElementById('film');
if (LIVE && Q.get('format') === 'tall') Object.assign(film.dataset, { width: '1080', height: '1350' });
const tall = +film.dataset.height > +film.dataset.width;

if (tall) film.classList.add('tall');
film.style.setProperty('--accent', V.accent);

document.documentElement.lang = L === 'en' ? 'en' : 'zh-TW';

// all copy comes from lib/content/home-sections.ts (zh-TW / en)
const COPY = {
  zh: {
    l1: ['把 ', 'AI', ' 想法，'], l2a: '做成團隊', l2b: ['真的能用的', '系統。'],
    lab: '設計原則', v1: '看過就會用。',
    stack: ['可驗證。', '可交付。', '可維護。'],

  en: {
    l1: ['Turn ', 'AI', ' ideas'], l2a: 'into systems', l2b: ['your team ', 'can use.'],
    lab: 'Design principle', v1: 'Understood\nat a glance.',
    stack: ['Testable.', 'Deliverable.', 'Maintainable.'],
    data: ['Accurate\ndata', 'Stable\nservice'],
    caps: [['AI architecture', 'RAG · On-prem models · Evaluation'], ['AI-assisted development', 'Ship faster with AI'], ['UIX & data', 'Accessible · Readable · GA conversion']],
    p1: '10M-scale push', unit: '-min delivery',
    tagline: 'Turn AI ideas into systems your team can use', cta: 'Book a 30-minute call',

}[L];
if (tall) Object.assign(COPY, {

}[L]);

const esc = (s) => s.replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]);
const unitRe = /[⺀-鿿　-〿＀-￯]|[^\s⺀-鿿　-〿＀-￯]+|\n|\s+/g;
// CJK rises per character, Latin per word; each unit sits in its own mask
const rise = (text, cls = '') => (text.match(unitRe) || []).map((u) =>
  u === '\n' ? '<br>' : /^\s+$/.test(u) ? ' ' : `<span class="m"><span class="c ${cls}">${esc(u)}</span></span>`).join('');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...(typeof r === 'string' ? document.querySelector(r) : r).querySelectorAll(s)];

$('.v1').innerHTML = rise(COPY.v1);
$('#s-stack').insertAdjacentHTML('beforeend', COPY.stack.map((s, i) =>
  `<div class="row" data-om-id="stack-${i + 1}" style="top:${tall ? 390 + i * 190 : 170 + i * 230}px"><span class="n mono">0${i + 1}</span><span class="t">${rise(s)}</span></div>`).join(''));
$('.dl').innerHTML = rise(COPY.data[0]);
$('.dr').innerHTML = rise(COPY.data[1]);
$('.p1').innerHTML = rise(COPY.p1);
$('.unit').innerHTML = rise(COPY.unit);
$('.tagline .txt').innerHTML = rise(COPY.tagline);
$('.cta .gt').textContent = COPY.cta;

// three capability cards, each followed by a real project; then four quick cuts
const shots = ['transcript-plus', 'ckd2026', 'powerbi', '1914', 'e-cooperative', 'experimentlab', 'b18'];
$('#caps').innerHTML = COPY.caps.map(([t, s], i) => `
  <section class="sc cap" id="s-cap${i}"><div class="cn mono">0${i + 1} / 03</div><div class="big ct" data-om-id="cap-${i + 1}">${rise(t)}</div><div class="cs">${esc(s)}</div></section>
  <section class="sc shot" id="s-shot${i}" data-om-id="work-${shots[i]}"><img src="assets/img/${shots[i]}.webp" alt=""><div class="shade"></div><span class="tag">${esc(t)}</span></section>`).join('')
  + shots.slice(3).map((s, i) => `<section class="sc shot" id="s-q${i}" data-om-id="work-${s}"><img src="assets/img/${s}.webp" alt=""><div class="shade"></div></section>`).join('');

function build() {
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
  const B = (n) => n * 0.5; // 120 BPM
  OM.music({ bpm: 120 });

  // hard cuts: exactly one scene visible at a time
  const order = [];
  let shown = null;
  const cut = (id, t) => {
    if (shown) tl.set(shown, { visibility: 'hidden' }, t);
    tl.set(id, { visibility: 'visible' }, t);
    shown = id; order.push([t, id]);
  };
  const hudSpans = $$('.hs span');
  const progBars = $$('.prog b');
  const section = (i, t) => {
    hudSpans.forEach((s, k) => tl.set(s, { visibility: k === i ? 'visible' : 'hidden' }, t));
    if (i > 0) tl.fromTo(progBars[i], { scaleX: 0 }, { scaleX: 1, duration: .4, ease: 'power3.out' }, t);
  };
  const up = (el, at, opts = {}) => tl.fromTo($$('.c', el), { yPercent: 140 }, { yPercent: 0, duration: opts.d || .45, stagger: opts.s ?? .035, ease: 'expo.out' }, at);

  // poster state (frame 0 and the loop target)
  gsap.set('#s-idea', { visibility: 'visible' }); shown = '#s-idea';
  gsap.set(hudSpans[0], { visibility: 'visible' });
  gsap.set(progBars[0], { scaleX: 1 });
  gsap.set('#wipe', { x: -3700 });

  // the mark drawn as a faint outline, turning slowly behind the type; back where it began at 20 s
  tl.fromTo('#ghost', { rotation: 0, x: 0 }, { rotation: 10, x: -60, duration: 10, ease: 'sine.inOut' }, 0)
    .to('#ghost', { rotation: 0, x: 0, duration: 10, ease: 'sine.inOut' }, 10)
    .fromTo('#ghost', { opacity: 1 }, { opacity: 0, duration: .3 }, B(29))
    .set('#ghost', { opacity: 1 }, B(39.2));

  // 1 · idea
  tl.addLabel('scene:idea', 0);
  tl.fromTo('.l1 .pill', { scale: 1.14 }, { scale: 1, duration: .45, ease: 'back.out(3)', immediateRender: false }, OM.sfx('pop', B(1), { gain: .6 }));
  tl.to('.l1', { scale: 1.035, duration: 1, ease: 'none' }, 0);
  cut('#s-idea2', OM.sfx('hit', B(2), { gain: .5 }));
  up('.l2a', B(2), { s: .05 });
  up('.l2b', B(3), { s: .045 });
  OM.sfx('thud', B(3) + .12, { gain: .6 });
  $('.sweep').style.width = `${$('.l2b').offsetWidth - 8}px`;
  if (tall) $('.sweep').style.top = `${$('.l2b').offsetTop + $('.l2b').offsetHeight + 24}px`;
  tl.fromTo('.sweep', { scaleX: 0 }, { scaleX: 1, duration: .55, ease: 'expo.inOut' }, OM.sfx('draw', B(5), { gain: .5 }));
  tl.fromTo('#s-idea2', { scale: 1 }, { scale: 1.025, duration: 2, ease: 'none', transformOrigin: '0 50%' }, B(2));

  // 2 · value
  tl.addLabel('scene:value', B(6));
  section(1, B(6));
  cut('#s-v1', OM.sfx('impact', B(6), { gain: .45 }));
  up('.v1', B(6), { s: .03, d: .4 });
  tl.fromTo('.v1', { scale: 1.12 }, { scale: 1, duration: .7 }, B(6))
    .fromTo('.lab', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, B(6) + .2);

  cut('#s-stack', B(8));
  const rows = $$('#s-stack .row');
  const lime = V.accent, cream = '#f3eee4', clear = 'rgba(0,0,0,0)', ghost = '#262b26';
  rows.forEach((row, i) => {
    const at = B(8 + i);
    up(row, at, { s: .03, d: .32 });
    OM.sfx('pop', at + .08, { note: i * 2 + 1, gain: .55, pan: -.3 + i * .3 });
    tl.fromTo(row, { '--fill': lime, '--stroke': clear }, { '--fill': lime, '--stroke': clear, duration: .01 }, at)
      .fromTo($('.n', row), { color: lime }, { color: lime, duration: .01 }, at);
    if (i > 0) tl.fromTo(rows[i - 1], { '--fill': lime, '--stroke': clear }, { '--fill': ghost, '--stroke': clear, duration: .18, ease: 'power2.out' }, at)
      .fromTo($('.n', rows[i - 1]), { color: lime }, { color: '#78816f', duration: .18 }, at);
  });
  tl.fromTo('.rbar', { x: 0, y: 0, scaleY: 0 }, { scaleY: 1, duration: .3 }, B(8));
  const barX = (row) => $('.t', row).offsetLeft + $('.t', row).offsetWidth + row.offsetLeft + 28;
  rows.forEach((row, i) => tl.to('.rbar', { x: barX(row), y: row.offsetTop + (tall ? 30 : 38), duration: i ? .28 : .01, ease: 'power3.out' }, B(8 + i)));
  // all three hold together in cream
  tl.to(rows.slice(0, 2), { '--fill': cream, '--stroke': clear, duration: .25, ease: 'power2.out' }, B(11))
    .to(rows[2], { '--fill': cream, duration: .25 }, B(11))
    .to('.rbar', { scaleY: 0, duration: .25, ease: 'power2.in' }, B(11));

  // the data pair, split by the logo's slash
  cut('#s-data', B(12));
  tl.fromTo('.slash', { rotation: -90, scaleY: .2, skewX: -21 }, { rotation: 0, scaleY: 1, skewX: -21, duration: .45 }, OM.sfx('whip', B(12), { gain: .5 }));
  tl.fromTo('.dl', { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: .45 }, B(12));
  up('.dl', B(12), { s: .04 });
  tl.fromTo('.dr', { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: .45 }, OM.sfx('thud', B(13), { gain: .6, pan: .3 }));
  up('.dr', B(13), { s: .04 });
  tl.to('.dl', { scaleX: 0, opacity: 0, duration: .4, ease: 'power3.in' }, OM.sfx('whoosh', B(15), { gain: .4 }) - .1)
    .to('.dr', { scaleX: 0, opacity: 0, duration: .4, ease: 'power3.in' }, B(15) - .1)
    .to('.slash', { scaleY: 0, duration: .2, ease: 'power2.in' }, B(15) + .25);

  // 3 · capability: one cut per beat, then four on the eighth notes
  tl.addLabel('scene:capability', B(16));
  section(2, B(16));
  COPY.caps.forEach((_, i) => {
    const at = B(16 + i * 2);
    cut(`#s-cap${i}`, at);
    up(`#s-cap${i} .ct`, at, { s: .04, d: .38 });
    tl.fromTo(`#s-cap${i} .cn`, { opacity: 0 }, { opacity: 1, duration: .2 }, at)
      .fromTo(`#s-cap${i} .cs`, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .35 }, at + .12);
    OM.sfx('hit', at, { gain: .45, pan: i % 2 ? .25 : -.25 });
    cut(`#s-shot${i}`, B(17 + i * 2));
    tl.fromTo(`#s-shot${i} img`, { scale: 1.14 }, { scale: 1.02, duration: .5, ease: 'power2.out' }, B(17 + i * 2))
      .fromTo(`#s-shot${i} .tag`, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .3 }, B(17 + i * 2) + .05);
  });
  shots.slice(3).forEach((_, i) => {
    const at = B(22) + i * .25;
    cut(`#s-q${i}`, at);
    tl.fromTo(`#s-q${i} img`, { scale: 1.08 }, { scale: 1, duration: .25, ease: 'power2.out' }, at);
    OM.sfx('tick', at, { gain: .35, pan: -.4 + i * .27 });
  });

  // 4 · proof: one beat of nothing, then the drop
  tl.addLabel('scene:proof', B(24));
  section(3, B(24));
  cut('#s-gap', B(24));
  cut('#s-proof', B(25));
  up('.p1', B(25), { s: .035, d: .4 });
  tl.fromTo('.p1', { scale: 1.25 }, { scale: 1, duration: .6 }, B(25));
  const count = { v: 0 };
  const numEl = $('.num');
  tl.fromTo('.num', { opacity: 0, yPercent: 40 }, { opacity: 1, yPercent: 0, duration: .35 }, B(26))
    .fromTo(count, { v: 0 }, { v: 30, duration: .5, ease: 'power2.out', onUpdate: () => { numEl.textContent = Math.round(count.v); } }, OM.sfx('count', B(26), { gain: .5, dur: .5 }));
  up('.unit', B(27), { s: .04 });
  OM.sfx('thud', B(27) + .1, { gain: .65 });
  tl.fromTo('.num', { scale: 1 }, { scale: 1.06, duration: .18, ease: 'power2.out', yoyo: true, repeat: 1 }, B(28));

  // 5 · brand: the full stop becomes the mark
  tl.addLabel('scene:brand', B(29));
  section(4, B(29));
  cut('#s-brand', B(29));
  const tagline = $('.tagline'), slot = $('.slot'), word = $('.word');
  const slotSize = slot.offsetWidth;
  const sx = tagline.offsetLeft + slot.offsetLeft + slotSize / 2 - 110;
  const sy = tagline.offsetTop + slot.offsetTop + slot.offsetHeight / 2 - 110;
  const wordW = word.offsetWidth;
  // lockup: mark + wordmark centred; the mark is drawn at 220 px and scaled to MK
  const MK = tall ? 160 : 220, gap = tall ? 40 : 52, lockY = tall ? 430 : 330;
  const lockX = (W - (MK + gap + wordW)) / 2;
  word.style.left = `${lockX + MK + gap}px`;
  word.style.top = `${lockY + MK / 2 - 0.3667 * parseFloat(getComputedStyle(word).fontSize)}px`;
  gsap.set('#mark', { x: sx, y: sy, scale: slotSize / 220 });
  gsap.set(['#mark .k1', '#mark .k3'], { transformOrigin: '50% 50%' });
  gsap.set('#mark .k2', { transformOrigin: '50% 50%' });
  tl.set('#mark', { visibility: 'visible' }, B(29));
  up('.tagline', B(29), { s: .012, d: .35 });
  tl.fromTo('#mark .k1', { scale: 0 }, { scale: 1, duration: .7, ease: OM.spring(.18) }, B(29) + .3)
    .fromTo('#mark .k3', { scale: 0 }, { scale: 1, duration: .7, ease: OM.spring(.18) }, B(29) + .4)
    .fromTo('#mark .k2', { scaleY: 0 }, { scaleY: 1, duration: .35, ease: 'expo.out' }, OM.sfx('chime', B(29) + .35, { gain: .5 }));
  tl.to('.tagline', { y: -70, opacity: 0, duration: .45, ease: 'power3.in' }, B(30) + .2)
    .fromTo('#mark', { x: sx, y: sy, scale: slotSize / 220 }, { x: lockX - (220 - MK) / 2, y: lockY - (220 - MK) / 2, scale: MK / 220, duration: .8, ease: 'expo.inOut' }, OM.sfx('whoosh', B(30) + .3, { gain: .4 }) - .1);
  tl.fromTo('.word', { autoAlpha: 0 }, { autoAlpha: 1, duration: .01 }, B(31) + .2);
  up('.word', B(31) + .2, { s: 0, d: .5 });
  tl.fromTo('.cta', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .45 }, OM.sfx('pop', B(32), { note: 5, gain: .55 }))
    .fromTo('.cta .url u', { scaleX: 0 }, { scaleX: 1, duration: .5, ease: 'expo.inOut' }, B(34))
    .fromTo('.cta .go i', { x: 0 }, { x: 12, duration: .22, ease: 'power2.out', yoyo: true, repeat: 1 }, B(35))
    .fromTo('#mark .k3', { scale: 1 }, { scale: 1.06, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false }, B(33))
    .fromTo('#mark .k1', { scale: 1 }, { scale: 1.08, duration: .7, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false }, B(35.5));

  // loop: the slash sweeps the frame and leaves frame 0 behind it
  tl.addLabel('scene:loop', B(38.4));
  tl.fromTo('#wipe', { x: -3700 }, { x: -540, duration: .4, ease: 'power2.in' }, B(38.4));
  OM.sfx('reverse', B(39.2), { gain: .45 });
  tl.set('#mark', { visibility: 'hidden' }, B(39.2));
  cut('#s-idea', B(39.2));
  section(0, B(39.2));
  tl.set(progBars.slice(1), { scaleX: 0 }, B(39.2))
    .set('.l1', { scale: 1 }, B(39.2))
    .to('#wipe', { x: 2400, duration: .4, ease: 'power2.out' }, B(39.2))
    .set({}, {}, B(40));

  window.__timelines = window.__timelines || {};
  window.__timelines['film'] = tl;
}

const ready = Promise.all([
  ...['600 100px Outfit', '800 100px Outfit', '500 24px "JetBrains Mono"', '600 100px "Noto Sans TC"', '400 40px "Noto Sans TC"'].map((f) => document.fonts.load(f)),
  // the renderer waits for every image; a live page starts after 2 s at most (hidden tabs can defer decoding)
  ...$$('img').map((img) => {
    const decoded = img.decode().catch(() => {});
    return LIVE ? Promise.race([decoded, new Promise((done) => setTimeout(done, 2000))]) : decoded;
  }),
]).then(build);
if (window.OM && OM.ready) OM.ready(ready);

// live playback: fill the frame (cover), loop forever, and take play / pause from the parent page
// (the parent plays the score itself and follows this timeline's clock)
if (LIVE) ready.then(() => {
  const tl = window.__timelines.film;
  const W = +film.dataset.width, H = +film.dataset.height;
  let playing = false;
  const fit = () => {
    const k = Math.max(innerWidth / W, innerHeight / H);
    film.style.transformOrigin = '0 0';
    film.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
  };
  fit();
  addEventListener('resize', fit);
  tl.repeat(-1);
  addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || e.data.film !== '8plus') return;
    if ('playing' in e.data) { playing = !!e.data.playing; playing ? tl.play() : tl.pause(); }
  });
  // the end card's booking pill is a real link on the parent page: report where it sits (film px) while it shows
  const go = $('.cta .go');
  let ctaOn = null;
  // a timer, not the ticker: requestAnimationFrame stops in hidden frames, the link should still follow
  setInterval(() => {
    const t = tl.time(), on = t > 16.5 && t < 19.3; // CTA settled after B(32), the wipe at B(38.4)
    if (on === ctaOn) return;
    ctaOn = on;
    const f = film.getBoundingClientRect(), r = go.getBoundingClientRect(), k = f.width / W;
    const rect = on ? [r.left - f.left, r.top - f.top, r.width, r.height].map((v) => Math.round(v / k)) : null;
    parent.postMessage({ film: '8plus', cta: rect }, location.origin);
  }, 200);
  parent.postMessage({ film: '8plus', ready: true }, location.origin);
});
</script>
</body>
