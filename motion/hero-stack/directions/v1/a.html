<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Stack diagram</title>
<script src="../../vendor/gsap.min.js"></script>
<link rel="stylesheet" href="../shared.css">
<style>
  .head { position: absolute; left: 72px; top: 64px; right: 72px; display: flex; justify-content: space-between; }
  .head b { color: var(--accent); font-weight: 500; }
  .stack { position: absolute; left: 72px; right: 72px; top: 132px; bottom: 72px; display: flex; flex-direction: column-reverse; gap: 10px; }
  .row { position: relative; flex: 0 0 116px; min-height: 0; box-sizing: border-box; display: grid; grid-template-columns: 64px 1fr 300px; align-items: center; gap: 22px; padding: 0 0 0 22px; border: 1px solid #ffffff1c; background: #0d1010; }
  .row .n { font: 500 14px "JetBrains Mono", monospace; color: var(--line); }
  .row h3 { margin: 0; font-size: 44px; font-weight: 500; letter-spacing: -.03em; }
  .row p { margin: 6px 0 0; font: 400 14px "JetBrains Mono", monospace; color: var(--muted); }
  .row .thumb { height: 114px; overflow: hidden; border-left: 1px solid #ffffff1c; }
  .row.lit { border-color: #e7ffac55; }
  .row.lit .n { color: var(--accent); }
  .row.on { background: var(--accent); color: #171c18; border-color: var(--accent); }
  .row.on .n, .row.on p { color: #171c18; }
  .row.off { opacity: .32; }
  .spine { position: absolute; left: 110px; top: 132px; bottom: 72px; width: 2px; background: linear-gradient(to top, var(--accent) 76%, #ffffff22 76%); }
  .packet { position: absolute; left: 103px; top: 336px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 8px #e7ffac33; }
  .loop { display: flex; gap: 8px; align-items: center; height: 100%; padding: 0 18px; font: 500 15px "JetBrains Mono", monospace; }
  .loop span { padding: 7px 10px; border: 1.5px solid #171c18; }
  .loop span.cur { background: #171c18; color: var(--accent); }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="1080" data-height="1080">
  <div class="head eyebrow"><span>8PLUS / STACK</span><span><b>06</b> / 07</span></div>
  <div class="stack">
    <div class="row lit"><span class="n">01</span><div><h3>Frontend</h3><p>brand site · 1914</p></div><div class="thumb"><img class="shot" src="../../assets/img/1914.webp"></div></div>
    <div class="row lit"><span class="n">02</span><div><h3>Backend</h3><p>NestJS · RabbitMQ</p></div><div class="thumb"><img class="shot" src="../../assets/img/flash-sale-api.webp"></div></div>
    <div class="row lit"><span class="n">03</span><div><h3>Database</h3><p>PostgreSQL · Redis · SQLite</p></div><div class="thumb"><img class="shot" src="../../assets/img/powerbi.webp"></div></div>
    <div class="row lit"><span class="n">04</span><div><h3>Architect</h3><p>WebApi · WorkerService</p></div><div class="thumb"><img class="shot" src="../../assets/img/smart-community-backend.webp"></div></div>
    <div class="row lit"><span class="n">05</span><div><h3>AI</h3><p>faster-whisper · MLX</p></div><div class="thumb"><img class="shot" src="../../assets/img/transcript-plus.webp"></div></div>
    <div class="row on"><span class="n">06</span><div><h3>AI Agent</h3><p>plan · act · verify</p></div><div class="loop"><span>plan</span>→<span class="cur">tool</span>→<span>check</span></div></div>
    <div class="row off"><span class="n">07</span><div><h3>AI Apps</h3><p>teams actually use</p></div><div class="thumb"></div></div>
  </div>
  <div class="spine"></div>
  <div class="packet"></div>
</div>
<script>window.__timelines = window.__timelines || {}; window.__timelines.film = gsap.timeline({ paused: true }).to({}, { duration: 1 });</script>
</body>
</html>
