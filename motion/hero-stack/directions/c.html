<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Liquid Glass</title>
<script src="../vendor/gsap.min.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  #film { background: #0b0f0e; }
  /* soft aurora from the brand's lime and cream, with one cool sage for depth */
  .aurora { position: absolute; inset: -10%; filter: blur(70px); }
  .aurora i { position: absolute; border-radius: 50%; }
  .grain { position: absolute; inset: 0; opacity: .14; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' seed='4'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  .glass { position: absolute; border-radius: 44px; background: linear-gradient(140deg, #ffffff38, #ffffff0c 55%, #ffffff1c); backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
    box-shadow: inset 0 1.5px 0 #ffffffb0, inset 0 -1px 0 #ffffff30, inset 1px 0 0 #ffffff40, 0 40px 80px -30px #000a; }
  .core { left: 250px; top: 300px; width: 580px; height: 440px; padding: 40px; box-sizing: border-box; color: #f3eee4; }
  .core .k { font: 500 14px "JetBrains Mono", monospace; letter-spacing: .14em; color: #e7ffac; }
  .core h2 { margin: 18px 0 0; font-size: 96px; line-height: .92; font-weight: 500; letter-spacing: -.06em; }
  .core p { margin: 22px 0 0; font: 400 22px "PingFang TC", sans-serif; color: #f3eee4cc; line-height: 1.5; }
  .core .apps { position: absolute; left: 40px; right: 40px; bottom: 36px; display: flex; gap: 12px; }
  .core .apps span { flex: 1; height: 74px; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #ffffff40; }
  .core .apps img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .chip { padding: 0 26px; height: 62px; border-radius: 31px; display: flex; align-items: center; gap: 12px; color: #f3eee4; font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: #e7ffac; box-shadow: 0 0 12px #e7ffac; }
  .chip small { font: 500 13px "JetBrains Mono", monospace; color: #f3eee499; }
  .path { position: absolute; inset: 0; }
  .head { position: absolute; left: 72px; top: 64px; color: #f3eee4aa; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="1080" data-height="1080">
  <div class="aurora">
    <i style="left:8%;top:12%;width:560px;height:520px;background:#e7ffac;opacity:.55"></i>
    <i style="left:52%;top:34%;width:620px;height:600px;background:#5f8f7d;opacity:.6"></i>
    <i style="left:18%;top:62%;width:520px;height:420px;background:#f3eee4;opacity:.35"></i>

  <div class="grain"></div>
  <div class="head eyebrow">8PLUS / FULL STACK → AI</div>
  <svg class="path" viewBox="0 0 1080 1080" fill="none" stroke="#f3eee455" stroke-width="1.5" stroke-dasharray="4 8">
    <path d="M180 190 C 300 230, 380 260, 430 300"/><path d="M930 230 C 860 260, 800 280, 760 300"/>
    <path d="M200 500 C 220 500, 236 505, 250 512"/><path d="M930 610 C 880 610, 850 600, 830 594"/>
    <path d="M300 900 C 340 830, 380 780, 420 740"/><path d="M820 900 C 780 840, 740 790, 700 740"/>
  </svg>
  <div class="glass chip" style="left:80px;top:150px"><i></i>Frontend <small>React</small></div>
  <div class="glass chip" style="left:700px;top:180px"><i></i>Backend <small>Python</small></div>
  <div class="glass chip" style="left:24px;top:470px;transform:scale(.9)"><i></i>Database <small>SQLite</small></div>
  <div class="glass chip" style="left:852px;top:600px;transform:scale(.92)"><i></i>Architect</div>
  <div class="glass chip" style="left:170px;top:880px"><i></i>AI <small>whisper</small></div>
  <div class="glass chip" style="left:690px;top:880px"><i></i>AI Agent</div>
  <div class="glass core">
    <div class="k">07 · AI APPS</div>
    <h2>Built to<br>be used.</h2>
    <p>團隊真的能用的系統。</p>
    <div class="apps"><span><img src="../assets/img/transcript-plus.webp"></span><span><img src="../assets/img/crm.webp"></span><span><img src="../assets/img/b18.webp"></span></div>
  </div>
</div>

</html>
