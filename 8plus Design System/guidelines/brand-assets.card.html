<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); padding: 0; }
  .row { display: flex; height: 180px; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .blue { background: var(--color-blue); }
  .orange { background: var(--color-orange); }
  .dark { background: var(--color-dark); }
  img { width: 60px; height: 60px; }
  .l { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.7); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell blue"><img src="../assets/logo-light.svg" alt="light" /><span class="l">logo-light.svg</span></div>
    <div class="cell orange"><img src="../assets/logo-light.svg" alt="on orange" /><span class="l">on orange field</span></div>
    <div class="cell dark"><img src="../assets/logo-new.svg" alt="brand tile" /><span class="l">logo-new.svg (tile)</span></div>
    <div class="cell dark"><img src="../assets/og/8plus.svg" alt="og" /><span class="l">og/8plus.svg</span></div>
  </div>
</body>
</html>
